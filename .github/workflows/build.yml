name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK 35
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        shell: bash
        run: |
          gradle assembleDebug --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Put errors in summary
        if: failure()
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E "^e: |AAPT|error:|What went wrong|Execution failed|Caused by" -A6 build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
